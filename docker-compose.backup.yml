# 명시적으로만 활성화한다. 원본 DB에는 read 권한만 있는 전용 URI를 사용한다.
# docker compose -f docker-compose.yml -f docker-compose.backup.yml --profile backup up -d backup
services:
    backup:
        image: pawpong-backup:latest
        build:
            context: .
            dockerfile: Dockerfile.backup
        profiles: [backup]
        environment:
            NODE_ENV: production
            NODE_OPTIONS: --max-old-space-size=128
            PROD_BACKUP_ENABLED: ${PROD_BACKUP_ENABLED:-false}
            PROD_BACKUP_SCHEDULE_ENABLED: ${PROD_BACKUP_SCHEDULE_ENABLED:-false}
            PROD_BACKUP_MONGODB_URI: ${PROD_BACKUP_MONGODB_URI:-}
            PROD_BACKUP_S3_BUCKET: ${PROD_BACKUP_S3_BUCKET:-}
            PROD_BACKUP_S3_ENDPOINT: ${PROD_BACKUP_S3_ENDPOINT:-}
            PROD_BACKUP_S3_REGION: ${PROD_BACKUP_S3_REGION:-kr-standard}
            PROD_BACKUP_S3_ACCESS_KEY: ${PROD_BACKUP_S3_ACCESS_KEY:-}
            PROD_BACKUP_S3_SECRET_KEY: ${PROD_BACKUP_S3_SECRET_KEY:-}
            PROD_BACKUP_ENCRYPTION_KEY: ${PROD_BACKUP_ENCRYPTION_KEY:-}
            PROD_BACKUP_KEY_ID: ${PROD_BACKUP_KEY_ID:-}
            SMILESERV_S3_BUCKET: ${SMILESERV_S3_BUCKET:-}
            REDIS_HOST: redis
            REDIS_PORT: '6379'
            REDIS_PASSWORD: ${REDIS_PASSWORD:-}
        networks: [pawpong_network]
        read_only: true
        volumes:
            - prod_backup_tmp:/tmp
        mem_limit: 512m
        cpus: 0.5
        pids_limit: 64
        restart: unless-stopped
        stop_grace_period: 65m
        logging:
            driver: json-file
            options: { max-size: 10m, max-file: '3' }
volumes:
    prod_backup_tmp:
