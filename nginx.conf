# ========================================
# Nginx Configuration for Pawpong Backend
# Blue-Green Deployment with SSL
# ========================================

# 허용 오리진만 그대로 돌려준다 (main.ts enableCors 목록과 동일하게 유지)
map $http_origin $pawpong_cors_origin {
    default                        "";
    "https://pawpong.kr"           $http_origin;
    "https://www.pawpong.kr"       $http_origin;
    "https://dev.pawpong.kr"       $http_origin;
    "https://admin.pawpong.kr"     $http_origin;
    "https://dev.admin.pawpong.kr" $http_origin;
}

# WebSocket 업그레이드 요청에만 Connection: upgrade 를 붙인다
map $http_upgrade $pawpong_connection_upgrade {
    default upgrade;
    ""      "";
}

# Upstream - Blue-Green 중 하나를 가리킴
upstream pawpong_backend {
    # 초기에는 blue (8080)를 사용
    # 업스트림이 1대뿐이라 죽은 것으로 표시하면 fail_timeout 동안 전부 502 가 된다
    server localhost:8080 max_fails=0;
    keepalive 32;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name api.pawpong.kr;

    # Let's Encrypt ACME challenge
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    # 나머지는 HTTPS로 리다이렉트
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name api.pawpong.kr;

    # SSL 인증서 (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.pawpong.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pawpong.kr/privkey.pem;

    # SSL 설정 (Mozilla Intermediate Configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # 보안 헤더
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 로그
    access_log /var/log/nginx/pawpong_access.log;
    error_log /var/log/nginx/pawpong_error.log;

    # 클라이언트 설정
    client_max_body_size 100M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Gzip 압축
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    # 프록시 설정
    location / {
        proxy_pass http://pawpong_backend;
        proxy_http_version 1.1;

        # 헤더 설정
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Connection 유지 — 업그레이드 요청에만 upgrade 를 보내야 upstream keepalive 가 산다
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pawpong_connection_upgrade;

        # 타임아웃 설정
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 버퍼링
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # nginx 가 직접 만드는 에러에는 CORS 헤더가 없어 브라우저가 응답을 차단한다.
    # 그러면 프론트에는 상태 코드 없이 "Network Error" 만 남아 장애 추적이 불가능하다.
    # 백엔드가 반환한 4xx/5xx 는 proxy_intercept_errors off(기본값)라 그대로 통과한다.
    error_page 502 503 504 = @pawpong_upstream_error;

    location @pawpong_upstream_error {
        # 명명 location 은 그 자체로 내부 전용이라 internal 을 따로 쓰지 않는다.
        # Content-Type 은 add_header 로 덮이지 않으므로 default_type 을 쓴다.
        default_type application/json;

        add_header Access-Control-Allow-Origin      $pawpong_cors_origin always;
        add_header Access-Control-Allow-Credentials true                 always;
        add_header Vary                             Origin               always;

        return 503 '{"success":false,"code":503,"error":"서버가 일시적으로 응답하지 못했습니다. 잠시 후 다시 시도해주세요."}';
    }

    # 헬스체크 엔드포인트 (로그 제외)
    location /api/health {
        proxy_pass http://pawpong_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Swagger UI - /api/docs를 /docs로 리다이렉트
    # NestJS SwaggerModule은 슬래시가 포함된 경로에서 정적 파일 서빙 문제가 있음
    location = /api/docs {
        return 301 /docs;
    }
    location ^~ /api/docs/ {
        return 301 /docs/;
    }

    # Swagger UI 실제 서빙 (/docs)
    location ^~ /docs {
        proxy_pass http://pawpong_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
    }
}