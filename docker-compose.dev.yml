# =============================================================================
# Pawpong Backend - 로컬 포그라운드 개발용 인프라
# =============================================================================
# NestJS 와 MongoDB 는 여기 없다.
#   - MongoDB: Atlas(dev) 외부 사용 — 컨테이너로 띄우지 않는다
#   - NestJS:  호스트에서 `pnpm start:dev` 로 띄워 핫리로드를 쓴다
# 즉 이 파일은 "앱이 붙을 주변 인프라"만 담당한다.
#
# 사용법:
#   docker compose -f docker-compose.dev.yml up -d
#   pnpm start:dev
#
# .env 에 필요한 값:
#   KAFKA_ENABLED=true
#   KAFKA_BROKER=localhost:9092
#   KAFKA_RECONNECT_INTERVAL_MS=10000  # 선택, 기본 10초
#   AI_AGENT_GRPC_URL=localhost:50051
#   REDIS_HOST=localhost / REDIS_PORT=6379
#
# 정리:
#   docker compose -f docker-compose.dev.yml down          # 컨테이너만
#   docker compose -f docker-compose.dev.yml down -v       # 큐/캐시 데이터까지
# =============================================================================

services:
    redis:
        image: redis:7-alpine
        container_name: pawpong_dev_redis
        ports:
            - '6379:6379'
        command: redis-server --appendonly yes
        volumes:
            - dev_redis_data:/data
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5

    # KRaft 모드 — zookeeper 컨테이너가 없어 로컬 메모리·기동 시간이 줄어든다
    kafka:
        image: confluentinc/cp-kafka:7.5.0
        container_name: pawpong_dev_kafka
        ports:
            - '9092:9092'
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: 'broker,controller'
            KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
            KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
            # 컨테이너 안(ai-agent)은 kafka:29092, 호스트(NestJS)는 localhost:9092 로 붙는다
            KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
            KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
            KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
            KAFKA_HEAP_OPTS: '-Xmx512m -Xms256m'
            CLUSTER_ID: 'pawpong-dev-cluster-01'
        volumes:
            - dev_kafka_data:/var/lib/kafka/data
        restart: unless-stopped
        healthcheck:
            test: ['CMD-SHELL', 'kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1']
            interval: 15s
            timeout: 10s
            retries: 10
            start_period: 30s

    # 결과 메시지를 눈으로 확인하고 수동 발행할 때 쓴다 (개발 전용)
    kafka-ui:
        image: provectuslabs/kafka-ui:latest
        container_name: pawpong_dev_kafka_ui
        depends_on:
            kafka:
                condition: service_healthy
        ports:
            - '8090:8080'
        environment:
            KAFKA_CLUSTERS_0_NAME: pawpong-dev
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
            DYNAMIC_CONFIG_ENABLED: 'true'
            JAVA_OPTS: '-Xmx256m -Xms128m'
        restart: unless-stopped

    ai-agent:
        build:
            # proto/ 를 NestJS 와 공유하므로 빌드 컨텍스트는 리포 루트다
            context: .
            dockerfile: ai-agent/Dockerfile
        image: pawpong-ai-agent:local
        container_name: pawpong_dev_ai_agent
        depends_on:
            kafka:
                condition: service_healthy
        ports:
            # 호스트의 NestJS 가 어드민 미리보기용으로 직접 호출한다
            - '50051:50051'
        environment:
            KAFKA_BROKER: kafka:29092
            AI_AGENT_GRPC_PORT: '50051'
            AI_CONCURRENCY: '1'
            # OPENAI_API_KEY 는 이 컨테이너에만 주입한다. .env 밖으로 나가지 않는다
            OPENAI_API_KEY: ${OPENAI_API_KEY:-}
            OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1}
            OPENAI_SUPPORT_MODEL: ${OPENAI_SUPPORT_MODEL:-gpt-4o-mini}
            SMILESERV_S3_ENDPOINT: ${SMILESERV_S3_ENDPOINT:-}
            SMILESERV_S3_ACCESS_KEY: ${SMILESERV_S3_ACCESS_KEY:-}
            SMILESERV_S3_SECRET_KEY: ${SMILESERV_S3_SECRET_KEY:-}
            SMILESERV_S3_BUCKET: ${SMILESERV_S3_BUCKET:-}
        restart: unless-stopped

volumes:
    dev_redis_data:
    dev_kafka_data:
