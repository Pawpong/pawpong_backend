name: Deploy to GCP (Main)

on:
    push:
        branches: [main]

env:
    GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    GAR_LOCATION: ${{ secrets.GAR_LOCATION }}
    SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
    INSTANCE_ZONE: ${{ secrets.INSTANCE_ZONE }}
    INSTANCE_NAME: ${{ secrets.INSTANCE_NAME }}
    GCP_SA_EMAIL: ${{ secrets.GCP_SA_EMAIL }}

concurrency:
    group: pawpong-production-deployment
    cancel-in-progress: false

jobs:
    build-and-deploy:
        name: Build and Deploy to GCP (Main)
        runs-on: ubuntu-latest

        permissions:
            contents: 'read'
            id-token: 'write'

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Authenticate to Google Cloud
              id: auth
              uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: 'projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
                  service_account: '${{ env.GCP_SA_EMAIL }}'

            - name: Set up Docker Buildx
              id: buildx
              uses: docker/setup-buildx-action@v3

            - name: Configure Docker for GAR
              run: gcloud auth configure-docker ${{ env.GAR_LOCATION }} --quiet

            - name: Build and push Docker image
              id: docker_build
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ${{ env.GAR_LOCATION }}/${{ env.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}/pawpong-backend:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Setup SSH for Production Server
              # 백엔드와 동일 커밋의 Agent 이미지를 준비한다.
              if: success()
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/prod_key
                  chmod 600 ~/.ssh/prod_key
                  ssh-keyscan -H "${{ secrets.PROD_SERVER_HOST }}" >> ~/.ssh/known_hosts || echo "SSH keyscan failed, will use StrictHostKeyChecking=no"

            - name: Build and push AI Agent image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ai-agent/Dockerfile
                  push: true
                  tags: ${{ env.GAR_LOCATION }}/${{ env.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}/pawpong-ai-agent:${{ github.sha }}

            - name: Configure AI Agent credential
              env:
                  OPENAI_API_KEY: ${{ secrets.PAWPONG_OPENAI_API_KEY }}
              run: |
                  test -n "$OPENAI_API_KEY"
                  printf '%s' "$OPENAI_API_KEY" | ssh -i ~/.ssh/prod_key -o StrictHostKeyChecking=no colding@${{ secrets.PROD_SERVER_HOST }} "python3 -c 'import sys,pathlib,os; p=pathlib.Path(\"/home/colding/pawpong_backend/.env.production\"); key=sys.stdin.read().strip(); assert key and \"\\n\" not in key; lines=[line for line in p.read_text().splitlines() if not line.startswith(\"OPENAI_API_KEY=\")]; p.write_text(\"\\n\".join(lines)+\"\\nOPENAI_API_KEY=\"+key+\"\\n\"); os.chmod(p,0o600)'"

            - name: Deploy to Production Server
              env:
                  GAR_LOCATION: ${{ env.GAR_LOCATION }}
                  GCP_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
                  SERVICE_NAME: ${{ env.SERVICE_NAME }}
                  COMMIT_SHA: ${{ github.sha }}
              run: |
                  echo "🚀 Starting deployment to production server..."
                  # Keep potentially large Docker pull logs out of the process environment.
                  # Print the log even when SSH/deployment fails.
                  trap 'cat deploy.log' EXIT
                  ssh -i ~/.ssh/prod_key -o StrictHostKeyChecking=no colding@${{ secrets.PROD_SERVER_HOST }} << ENDSSH > deploy.log 2>&1
                  set -e

                  echo "📦 Authenticating with Artifact Registry..."
                  gcloud auth activate-service-account --key-file=/home/colding/gcp-service-account.json
                  gcloud auth configure-docker ${GAR_LOCATION} --quiet

                  cd /home/colding/pawpong_backend || { echo "❌ Directory not found"; exit 1; }

                  echo "📥 Pulling latest code..."
                  git pull --ff-only origin main
                  test "\$(git rev-parse HEAD)" = "${COMMIT_SHA}"

                  echo "🐳 Pulling Docker image from Artifact Registry..."
                  IMAGE_TAG="${GAR_LOCATION}/${GCP_PROJECT_ID}/${SERVICE_NAME}/pawpong-backend:${COMMIT_SHA}"
                  docker pull "\$IMAGE_TAG"
                  docker tag "\$IMAGE_TAG" pawpong-backend:latest
                  docker tag "\$IMAGE_TAG" pawpong-backend:${COMMIT_SHA}

                  AGENT_IMAGE="${GAR_LOCATION}/${GCP_PROJECT_ID}/${SERVICE_NAME}/pawpong-ai-agent:${COMMIT_SHA}"
                  docker pull "\$AGENT_IMAGE"
                  docker tag "\$AGENT_IMAGE" pawpong-ai-agent:latest

                  echo "Running Blue-Green deployment..."
                  bash deploy.sh ${COMMIT_SHA}

                  echo "✅ Deployment completed successfully!"
                  ENDSSH

            - name: Send standardized deployment result
              if: always()
              env:
                  APP_ENV: production
                  DEPLOY_SERVICE: backend + ai-agent
                  GH_TOKEN: ${{ github.token }}
                  DEPLOY_REPOSITORY: ${{ github.repository }}
                  DEPLOY_BRANCH: ${{ github.ref_name }}
                  DEPLOY_ACTOR: ${{ github.triggering_actor }}
                  DEPLOY_METHOD: Docker Blue-Green + AI Agent
                  DEPLOY_TARGET: 운영 서버 · api.pawpong.kr
                  DEPLOY_URL: https://api.pawpong.kr
                  DEPLOY_COMMIT: ${{ github.sha }}
                  DEPLOY_STATUS: ${{ job.status }}
                  DEPLOY_HEALTH: ${{ job.status == 'success' && 'passed deployment readiness checks' || 'not verified; inspect workflow log' }}
                  DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
                  DISCORD_DEV_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEV_DEPLOY_WEBHOOK_URL }}
              run: python3 ops/observability/notify.py
