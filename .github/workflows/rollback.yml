name: Manual Rollback

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Rollback version number (1 = most recent previous, 2 = two versions ago, etc.)'
                required: false
                default: '1'
                type: string
            confirm:
                description: 'Type "ROLLBACK" to confirm'
                required: true
                type: string

jobs:
    rollback:
        name: Rollback to Previous Version
        runs-on: ubuntu-latest
        if: ${{ github.event.inputs.confirm == 'ROLLBACK' }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup SSH for Production Server
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/prod_key
                  chmod 600 ~/.ssh/prod_key
                  ssh-keyscan -H "${{ secrets.PROD_SERVER_HOST }}" >> ~/.ssh/known_hosts || true

            - name: Check deployment history
              id: check_history
              run: |
                  echo "Checking deployment history..."
                  ssh -i ~/.ssh/prod_key -o StrictHostKeyChecking=no colding@${{ secrets.PROD_SERVER_HOST }} << 'ENDSSH'
                  cd /home/colding/pawpong_backend
                  if [ -f .deploy_history ]; then
                      echo "=== Available versions ==="
                      cat -n .deploy_history
                  else
                      echo "No deployment history found"
                      exit 1
                  fi
                  ENDSSH

            - name: Execute Rollback
              env:
                  VERSION: ${{ github.event.inputs.version }}
              run: |
                  echo "Starting rollback to version $VERSION..."
                  ssh -i ~/.ssh/prod_key -o StrictHostKeyChecking=no colding@${{ secrets.PROD_SERVER_HOST }} << ENDSSH > rollback.log 2>&1
                  cd /home/colding/pawpong_backend
                  bash rollback.sh ${VERSION}
                  ENDSSH
                  cat rollback.log
                  echo "ROLLBACK_LOG<<EOF" >> $GITHUB_ENV
                  cat rollback.log >> $GITHUB_ENV
                  echo "EOF" >> $GITHUB_ENV

            - name: Send standardized deployment result
              if: always()
              env:
                  APP_ENV: production
                  DEPLOY_SERVICE: backend rollback
                  DEPLOY_COMMIT: ${{ github.sha }}
                  DEPLOY_STATUS: ${{ job.status }}
                  DEPLOY_HEALTH: ${{ job.status == 'success' && 'passed deployment readiness checks' || 'not verified; inspect workflow log' }}
                  DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
                  DISCORD_DEV_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEV_DEPLOY_WEBHOOK_URL }}
              run: python3 ops/observability/notify.py

    cancelled:
        name: Rollback Cancelled
        runs-on: ubuntu-latest
        if: ${{ github.event.inputs.confirm != 'ROLLBACK' }}
        steps:
            - name: Cancelled
              run: |
                  echo "Rollback cancelled. You must type 'ROLLBACK' to confirm."
                  exit 1
