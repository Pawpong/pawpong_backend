# /etc/nginx/snippets/ 에 설치 — api.pawpong.kr TLS server 블록 안에서 include 한다.
#
# nginx 가 직접 만드는 에러(502/503/504)에는 CORS 헤더가 없다.
# 크로스 오리진(pawpong.kr → api.pawpong.kr)에서는 브라우저가 그 응답을 차단하므로
# 프론트 axios 는 상태 코드를 보지 못하고 "Network Error" 만 남는다.
# 사용자도 Sentry 도 원인을 알 수 없어 장애 추적이 불가능해진다.
#
# 백엔드가 직접 반환한 4xx/5xx 는 proxy_intercept_errors 가 off(기본값)라 그대로 통과하며,
# 그 응답에는 백엔드가 붙인 CORS 헤더가 이미 들어 있다. 여기서 헤더를 덧붙이지 않으므로
# Access-Control-Allow-Origin 이 중복되지 않는다.
error_page 502 503 504 = @pawpong_upstream_error;

location @pawpong_upstream_error {
    # 명명 location 은 그 자체로 내부 전용이라 internal 을 따로 쓰지 않는다.
    # Content-Type 은 add_header 로 덮이지 않으므로 default_type 을 쓴다.
    default_type application/json;

    add_header Access-Control-Allow-Origin      $pawpong_cors_origin always;
    add_header Access-Control-Allow-Credentials true                 always;
    add_header Vary                             Origin               always;

    # 프론트 공통 응답 포맷(ApiResponseDto)과 같은 모양 — error 필드가 화면에 그대로 노출된다.
    return 503 '{"success":false,"code":503,"error":"서버가 일시적으로 응답하지 못했습니다. 잠시 후 다시 시도해주세요."}';
}
