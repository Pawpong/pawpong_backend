# /etc/nginx/conf.d/ 에 설치 — http 레벨이어야 하므로 server 블록 밖에 둔다.

# 허용 오리진만 그대로 돌려준다. 목록 밖이면 빈 값이 되어 add_header 가 나가지 않는다.
# (백엔드 main.ts 의 enableCors origin 목록과 같은 값을 유지해야 한다)
map $http_origin $pawpong_cors_origin {
    default                       "";
    "https://pawpong.kr"          $http_origin;
    "https://www.pawpong.kr"      $http_origin;
    "https://dev.pawpong.kr"      $http_origin;
    "https://admin.pawpong.kr"    $http_origin;
    "https://dev.admin.pawpong.kr" $http_origin;
}

# WebSocket 업그레이드 요청에만 Connection: upgrade 를 붙이는 표준 패턴.
# 기존 설정은 Connection 을 두 번 세팅해 모든 요청에 upgrade 가 붙었고,
# 그 탓에 upstream keepalive(keepalive 32)가 동작하지 못했다.
map $http_upgrade $pawpong_connection_upgrade {
    default upgrade;
    ""      "";
}
