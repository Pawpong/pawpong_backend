# Include inside the api.pawpong.kr TLS server. Legitimate 401/404/429 do not trigger bans.
# Dotfiles, WordPress and PHP execution paths are not Pawpong API routes.
location ~* ^/(?:\.env(?:[./~_-]|$)|\.git(?:/|$)|wp-(?:admin|login|config|includes|content)(?:[./~_-]|$)|xmlrpc\.php$|vendor/phpunit(?:/|$)) {
    access_log /var/log/nginx/pawpong_probe.log pawpong_probe;
    return 403;
}
